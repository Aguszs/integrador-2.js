<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Iniciar sesión | Estudio de Uñas</title>
</head>
<body>
   
    <section>
        
        <h2>Iniciar Sesion</h2>

        <form id="loginForm">
            <label>Mail</label>
            <input type="email" placeholder="Ingresar Email" id="email" autocomplete="username" required autofocus>
            <label>Contraseña</label>
            <input type="password" placeholder="Ingresar Contraseña" id="password" autocomplete="current-password" required>
            <input type="submit" value="Ingresar">
        </form>
        <p>No tenés una cuenta? <a href="signUp.index.html">Registrate</a></p>
        <p class="demo-notice">Acceso de demostración: los datos se guardan solo en este navegador. No uses una contraseña real.</p>
    </section>

    <script src="js/login.js"></script>
</body>
</html>
